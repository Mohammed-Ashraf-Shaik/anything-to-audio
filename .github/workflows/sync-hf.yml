name: Sync to Hugging Face Spaces

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        if: env.HF_TOKEN != ''
        run: |
          git checkout -b hf-deploy
          # Prepend Hugging Face Space Docker metadata so HF automatically builds Docker on port 8000
          printf -- "---\ntitle: SonicAM\nemoji: ☕\ncolorFrom: yellow\ncolorTo: brown\nsdk: docker\napp_port: 8000\n---\n\n" > /tmp/hf_meta.md
          cat README.md >> /tmp/hf_meta.md
          mv /tmp/hf_meta.md README.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(hf): configure Hugging Face Spaces Docker runtime"
          git push --force https://Mohammed-Ashraf-Shaik:$HF_TOKEN@huggingface.co/spaces/Mohammed-Ashraf-Shaik/SONICAM hf-deploy:main

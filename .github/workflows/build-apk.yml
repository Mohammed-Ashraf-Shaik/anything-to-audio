name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Choose APK Build Type (release, debug, or both)"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug
          - both
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build-apk:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🤖 Accept Android SDK Licenses
        run: |
          echo "Using pre-installed Android SDK at $ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 🟢 Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ⚡ Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/package.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 📦 Install Dependencies
        working-directory: ./mobile
        run: |
          npm install --legacy-peer-deps
          npx expo install --fix

      - name: 🏗️ Prebuild Native Android Project
        working-directory: ./mobile
        run: |
          npx expo prebuild --platform android --clean

      - name: 🔨 Build Standalone Android APK
        working-directory: ./mobile/android
        run: |
          chmod +x gradlew
          
          # Pass node_modules path so Gradle's subshells resolve React Native modules in monorepo
          export NODE_PATH="$(cd .. && pwd)/node_modules"
          export PATH="$(cd .. && pwd)/node_modules/.bin:$PATH"

          # Optimize Gradle properties for CI build stability
          echo "newArchEnabled=false" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> gradle.properties

          BUILD_CHOICE="${{ github.event.inputs.build_type || 'release' }}"
          echo "Selected Build Type: $BUILD_CHOICE"

          mkdir -p app/build/outputs/apk/output

          # 1. Build Debug APK (instantly installable on any Android device)
          if [ "$BUILD_CHOICE" = "debug" ] || [ "$BUILD_CHOICE" = "both" ]; then
            echo "--- Building Debug APK ---"
            ./gradlew assembleDebug --stacktrace --no-daemon
            mkdir -p app/build/outputs/apk/output
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/output/SonicID-Debug.apk
          fi

          # 2. Build Release APK (standalone signed with keytool for direct installation)
          if [ "$BUILD_CHOICE" = "release" ] || [ "$BUILD_CHOICE" = "both" ]; then
            echo "--- Building Release APK ---"
            ./gradlew assembleRelease --stacktrace --no-daemon

            KEYSTORE="standalone-release.keystore"
            keytool -genkey -v -keystore "$KEYSTORE" -alias sonicid -keyalg RSA -keysize 2048 -validity 10000 -storepass sonicid123 -keypass sonicid123 -dname "CN=SonicID, OU=Mobile, O=SonicID, C=US"
            
            APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
            echo "Using apksigner: $APKSIGNER"

            RELEASE_DIR="app/build/outputs/apk/release"
            
            if [ -f "$RELEASE_DIR/app-release-unsigned.apk" ]; then
              $APKSIGNER sign --ks "$KEYSTORE" --ks-pass pass:sonicid123 --out app/build/outputs/apk/output/SonicID-Release.apk "$RELEASE_DIR/app-release-unsigned.apk"
              echo "Signed release APK generated at output/SonicID-Release.apk"
            elif [ -f "$RELEASE_DIR/app-release.apk" ]; then
              $APKSIGNER sign --ks "$KEYSTORE" --ks-pass pass:sonicid123 --out app/build/outputs/apk/output/SonicID-Release.apk "$RELEASE_DIR/app-release.apk"
            fi
          fi

      - name: 📤 Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SonicID-Android-APK
          path: mobile/android/app/build/outputs/apk/output/*.apk
          retention-days: 30

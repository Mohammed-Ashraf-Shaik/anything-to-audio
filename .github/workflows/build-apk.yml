name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Choose APK Build Type"
        required: true
        default: "both"
        type: choice
        options:
          - release
          - debug
          - both
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - "frontend/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build-apk:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🤖 Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 🟢 Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ⚡ Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/package.json') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: 📦 Install JS Dependencies
        working-directory: ./mobile
        run: npm install --legacy-peer-deps

      - name: 🏗️ Expo Prebuild (Generate Native Android Project)
        working-directory: ./mobile
        run: |
          python3 build_bundle.py || true
          npx expo prebuild --platform android --clean

          # Allow HTTP traffic
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /g' \
            android/app/src/main/AndroidManifest.xml || true

      - name: 📦 Embed JS Bundle into APK Assets (CRITICAL)
        working-directory: ./mobile
        run: |
          # This is the ONLY correct command for Expo managed workflow.
          # It pre-generates index.android.bundle so the APK runs standalone
          # WITHOUT needing Metro dev server (localhost:8081).
          mkdir -p android/app/src/main/assets

          npx expo export:embed \
            --platform android \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res \
            --dev false

          echo "=== Bundle generated ==="
          ls -lh android/app/src/main/assets/index.android.bundle
          echo "Bundle size: $(stat -c%s android/app/src/main/assets/index.android.bundle) bytes"

          # Sanity check: must be at least 100KB to be a valid bundle
          BUNDLE_SIZE=$(stat -c%s android/app/src/main/assets/index.android.bundle)
          if [ "$BUNDLE_SIZE" -lt 102400 ]; then
            echo "FATAL: Bundle is too small ($BUNDLE_SIZE bytes) — likely empty or broken!"
            exit 1
          fi
          echo "Bundle OK: $BUNDLE_SIZE bytes"

      - name: 🔨 Build Standalone APK
        working-directory: ./mobile/android
        env:
          NODE_PATH: "${{ github.workspace }}/mobile/node_modules"
        run: |
          chmod +x gradlew
          export PATH="${{ github.workspace }}/mobile/node_modules/.bin:$PATH"

          # Critical Gradle flags
          {
            echo "newArchEnabled=false"
            echo "hermesEnabled=true"
            echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
            # BUNDLE_IN_DEBUG/RELEASE=false tells Gradle to skip its own bundling
            # step because we already embedded the bundle above
            echo "BUNDLE_IN_DEBUG=false"
            echo "BUNDLE_IN_RELEASE=false"
          } >> gradle.properties

          BUILD_CHOICE="${{ github.event.inputs.build_type || 'both' }}"
          mkdir -p app/build/outputs/apk/output

          # ── Debug APK ─────────────────────────────────────────────────
          if [ "$BUILD_CHOICE" = "debug" ] || [ "$BUILD_CHOICE" = "both" ]; then
            echo "=== Building Debug APK ==="
            ./gradlew assembleDebug --stacktrace --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk \
               app/build/outputs/apk/output/SonicAM-Debug.apk

            echo "=== Verifying JS bundle is INSIDE the Debug APK ==="
            unzip -l app/build/outputs/apk/output/SonicAM-Debug.apk \
              | grep "index.android.bundle" \
              || { echo "FATAL: bundle missing from Debug APK!"; exit 1; }

            echo "Debug APK OK: $(stat -c%s app/build/outputs/apk/output/SonicAM-Debug.apk) bytes"
          fi

          # ── Release APK ───────────────────────────────────────────────
          if [ "$BUILD_CHOICE" = "release" ] || [ "$BUILD_CHOICE" = "both" ]; then
            echo "=== Building Release APK ==="

            KEYSTORE="${{ github.workspace }}/mobile/sonicam-release.keystore"
            if [ ! -f "$KEYSTORE" ]; then
              keytool -genkey -v \
                -keystore "$KEYSTORE" -alias sonicam \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass sonicam123 -keypass sonicam123 \
                -dname "CN=SonicAM,OU=Mobile,O=SonicAM,C=US"
            fi

            ./gradlew assembleRelease --stacktrace --no-daemon

            ZIPALIGN=$(find $ANDROID_HOME/build-tools -name zipalign | sort -V | tail -n1)
            APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n1)
            RELEASE_DIR="app/build/outputs/apk/release"

            # Pick whichever output file Gradle produced
            if   [ -f "$RELEASE_DIR/app-release-unsigned.apk" ]; then
              SOURCE="$RELEASE_DIR/app-release-unsigned.apk"
            elif [ -f "$RELEASE_DIR/app-release.apk" ]; then
              SOURCE="$RELEASE_DIR/app-release.apk"
            else
              echo "FATAL: no release APK found in $RELEASE_DIR"
              ls -lah "$RELEASE_DIR" || true
              exit 1
            fi

            $ZIPALIGN -p -f 4 "$SOURCE" app/build/outputs/apk/output/aligned.apk
            $APKSIGNER sign \
              --ks "$KEYSTORE" --ks-alias sonicam --ks-pass pass:sonicam123 \
              --out app/build/outputs/apk/output/SonicAM-Release.apk \
              app/build/outputs/apk/output/aligned.apk

            $APKSIGNER verify --verbose app/build/outputs/apk/output/SonicAM-Release.apk

            echo "=== Verifying JS bundle is INSIDE the Release APK ==="
            unzip -l app/build/outputs/apk/output/SonicAM-Release.apk \
              | grep "index.android.bundle" \
              || { echo "FATAL: bundle missing from Release APK!"; exit 1; }

            cp app/build/outputs/apk/output/SonicAM-Release.apk \
               app/build/outputs/apk/output/SonicAM.apk
            echo "Release APK OK: $(stat -c%s app/build/outputs/apk/output/SonicAM-Release.apk) bytes"
          fi

          echo "=== Final APK list ==="
          ls -lh app/build/outputs/apk/output/

      - name: 📤 Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SonicAM-Android-APK-v1.2.5
          path: mobile/android/app/build/outputs/apk/output/*.apk
          retention-days: 30

      - name: 🚀 Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.2.5
          name: "SonicAM v1.2.5 — Standalone Android APK (No Dev Server Required)"
          make_latest: true
          body: |
            ## ☕ SonicAM v1.2.5 — Universal Android APK

            **✅ Fixed**: APK now runs completely standalone — no Metro dev server, no "Could not connect to development server" error.

            The JS bundle (`index.android.bundle`) is fully embedded inside the APK using `expo export:embed`.

            | File | Description |
            |---|---|
            | **SonicAM-Debug.apk** | ⬅️ **Install this one** — zero Play Protect warnings, opens immediately |
            | **SonicAM-Release.apk / SonicAM.apk** | Signed production build |

            **Compatibility**: Android 7.0+ · ARM64 · ARMv7 · x86_64

            > **Install tip**: Uninstall old version first, then tap the downloaded APK from your Files app.
          files: mobile/android/app/build/outputs/apk/output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

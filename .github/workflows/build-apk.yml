name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Choose APK Build Type"
        required: true
        default: "both"
        type: choice
        options:
          - release
          - debug
          - both
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - "frontend/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build-apk:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🤖 Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 🟢 Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ⚡ Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/package.json') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: 📦 Install JS Dependencies
        working-directory: ./mobile
        run: npm install --legacy-peer-deps

      - name: 🏗️ Expo Prebuild (Generate Native Android Project)
        working-directory: ./mobile
        run: |
          # Regenerate the bundled WebView HTML asset
          python3 build_bundle.py || true

          # Generate the native Android project from the Expo config
          npx expo prebuild --platform android --clean

      - name: 🔧 Configure Standalone Native Project (No Metro Server Required)
        working-directory: ./mobile/android
        run: |
          # 1. Allow cleartext HTTP so WebView can reach cloud backends
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /g' \
            app/src/main/AndroidManifest.xml || true

          # 2. Inject bundleInDebug = true and bundleInRelease = true into app/build.gradle
          # This forces Gradle to execute the JS bundling task for Debug as well as Release
          node -e '
          const fs = require("fs");
          const file = "app/build.gradle";
          let content = fs.readFileSync(file, "utf8");
          if (!content.includes("bundleInDebug = true")) {
            content = content.replace(/react\s*\{/, "react {\n    bundleInDebug = true\n    bundleInRelease = true");
            fs.writeFileSync(file, content);
            console.log("Injected bundleInDebug = true and bundleInRelease = true into app/build.gradle");
          }
          '

          # 3. Disable developer support in MainApplication
          # When getUseDeveloperSupport returns false, React Native NEVER attempts to connect
          # to localhost:8081 / Metro development server. It loads the embedded bundle directly.
          node -e '
          const fs = require("fs");
          const path = require("path");
          function walk(dir) {
            for (const f of fs.readdirSync(dir)) {
              const full = path.join(dir, f);
              if (fs.statSync(full).isDirectory()) walk(full);
              else if (f.startsWith("MainApplication")) {
                let code = fs.readFileSync(full, "utf8");
                code = code.replace(/override\s+fun\s+getUseDeveloperSupport\(\):\s*Boolean\s*=\s*BuildConfig\.DEBUG/g, "override fun getUseDeveloperSupport(): Boolean = false");
                code = code.replace(/return\s+BuildConfig\.DEBUG;/g, "return false;");
                fs.writeFileSync(full, code);
                console.log("Disabled developer support in: " + full);
              }
            }
          }
          walk("app/src/main");
          '

          # 4. Tune Gradle memory and architecture settings
          cat >> gradle.properties << 'EOF'
          newArchEnabled=false
          hermesEnabled=true
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
          EOF

          echo "=== gradle.properties ==="
          tail -10 gradle.properties

      - name: 🔨 Build Release APK (Signed Standalone)
        if: ${{ github.event.inputs.build_type != 'debug' }}
        working-directory: ./mobile/android
        run: |
          export PATH="${{ github.workspace }}/mobile/node_modules/.bin:$PATH"
          export NODE_PATH="${{ github.workspace }}/mobile/node_modules"

          chmod +x gradlew

          # Keystore for signing
          KEYSTORE="${{ github.workspace }}/mobile/sonicam-release.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            echo "Generating keystore..."
            keytool -genkey -v \
              -keystore "$KEYSTORE" -alias sonicam \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass sonicam123 -keypass sonicam123 \
              -dname "CN=SonicAM,OU=Mobile,O=SonicAM,C=US"
          fi

          ./gradlew assembleRelease --stacktrace --no-daemon

          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name zipalign | sort -V | tail -n1)
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n1)
          RELEASE_DIR="app/build/outputs/apk/release"
          mkdir -p app/build/outputs/apk/output

          echo "=== Release directory contents ==="
          ls -lah "$RELEASE_DIR"

          # Pick the unsigned or release APK
          if [ -f "$RELEASE_DIR/app-release-unsigned.apk" ]; then
            SRC="$RELEASE_DIR/app-release-unsigned.apk"
          elif [ -f "$RELEASE_DIR/app-release.apk" ]; then
            SRC="$RELEASE_DIR/app-release.apk"
          else
            echo "FATAL: No release APK found!"; exit 1
          fi

          rm -f app/build/outputs/apk/output/aligned-release.apk
          $ZIPALIGN -p -f 4 "$SRC" app/build/outputs/apk/output/aligned-release.apk
          $APKSIGNER sign \
            --ks "$KEYSTORE" --ks-alias sonicam --ks-pass pass:sonicam123 \
            --out app/build/outputs/apk/output/SonicAM-Release.apk \
            app/build/outputs/apk/output/aligned-release.apk

          cp app/build/outputs/apk/output/SonicAM-Release.apk \
             app/build/outputs/apk/output/SonicAM.apk

          # VERIFY the JS bundle is physically inside the Release APK
          echo "=== Checking JS bundle is inside Release APK ==="
          unzip -l app/build/outputs/apk/output/SonicAM-Release.apk | grep "index.android.bundle" \
            || { echo "FATAL: JS bundle missing from Release APK!"; exit 1; }

          $APKSIGNER verify --verbose app/build/outputs/apk/output/SonicAM-Release.apk
          echo "✅ Release APK OK: $(stat -c%s app/build/outputs/apk/output/SonicAM-Release.apk) bytes"

      - name: 🔨 Build Debug APK (Standalone, No Play Protect Warnings)
        if: ${{ github.event.inputs.build_type != 'release' }}
        working-directory: ./mobile/android
        run: |
          export PATH="${{ github.workspace }}/mobile/node_modules/.bin:$PATH"
          export NODE_PATH="${{ github.workspace }}/mobile/node_modules"

          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

          mkdir -p app/build/outputs/apk/output
          cp app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/output/SonicAM-Debug.apk

          # VERIFY the JS bundle is physically inside the Debug APK
          echo "=== Checking JS bundle is inside Debug APK ==="
          unzip -l app/build/outputs/apk/output/SonicAM-Debug.apk | grep "index.android.bundle" \
            || { echo "FATAL: JS bundle missing from Debug APK!"; exit 1; }

          echo "✅ Debug APK OK: $(stat -c%s app/build/outputs/apk/output/SonicAM-Debug.apk) bytes"

      - name: 📋 List All Built APKs
        working-directory: ./mobile/android
        run: ls -lh app/build/outputs/apk/output/ || true

      - name: 📤 Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SonicAM-Android-APK-v1.2.5
          path: mobile/android/app/build/outputs/apk/output/*.apk
          retention-days: 30

      - name: 🚀 Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.2.5
          name: "SonicAM v1.2.5 — Standalone Android APK (Phones & Tablets)"
          make_latest: true
          body: |
            ## ☕ SonicAM v1.2.5 — Universal Android APK

            **✅ 100% Standalone & Pre-bundled** — Launches instantly on any device without development server.

            ### 📦 Download Options
            | File | Type | Recommended For |
            |---|---|---|
            | **[SonicAM.apk](https://github.com/Mohammed-Ashraf-Shaik/anything-to-audio/releases/latest/download/SonicAM.apk)** | Signed Release | **Universal Official Production APK** (Phones, Phablets & Tablets) |
            | **[SonicAM-Release.apk](https://github.com/Mohammed-Ashraf-Shaik/anything-to-audio/releases/latest/download/SonicAM-Release.apk)** | Signed Release | Same as SonicAM.apk |
            | **[SonicAM-Debug.apk](https://github.com/Mohammed-Ashraf-Shaik/anything-to-audio/releases/latest/download/SonicAM-Debug.apk)** | Standalone Debug | Direct install with zero Play Protect signature prompts |

            ### 📱 Compatibility
            - **OS**: Android 7.0 (Nougat) to Android 15+
            - **Architectures**: ARM64 (`arm64-v8a`), ARMv7 (`armeabi-v7a`), x86_64
            - **Devices**: All smartphones, phablets, foldables, and tablets

            ### 🚀 Installation Guide
            1. Download `SonicAM.apk` or `SonicAM-Debug.apk`.
            2. If you have an older version installed, uninstall it first.
            3. Open your device's **Files** or **Downloads** app and tap the APK to install.
            4. Tap **Open** — SonicAM will launch immediately into the dark roast interface with full song detection.
          files: mobile/android/app/build/outputs/apk/output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

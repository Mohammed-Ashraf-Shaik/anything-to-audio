name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Choose APK Build Type (release, debug, or both)"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug
          - both
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - "frontend/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build-apk:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🤖 Accept Android SDK Licenses
        run: |
          echo "Using pre-installed Android SDK at $ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 🟢 Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ⚡ Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/package.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 📦 Install Dependencies
        working-directory: ./mobile
        run: |
          npm install --legacy-peer-deps
          npx expo install --fix

      - name: 🏗️ Prebuild Native Android Project
        working-directory: ./mobile
        run: |
          python3 build_bundle.py || true
          npx expo prebuild --platform android --clean
          # Ensure cleartext HTTP is explicitly permitted in native AndroidManifest.xml
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /g' android/app/src/main/AndroidManifest.xml || true

      - name: 🔨 Build Standalone Universal Android APK (Phones & Tablets)
        working-directory: ./mobile/android
        run: |
          chmod +x gradlew
          
          # Pass node_modules path so Gradle's subshells resolve React Native modules in monorepo
          export NODE_PATH="$(cd .. && pwd)/node_modules"
          export PATH="$(cd .. && pwd)/node_modules/.bin:$PATH"

          # Optimize Gradle properties for CI build stability & Universal Device Compatibility
          echo "newArchEnabled=false" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> gradle.properties

          BUILD_CHOICE="${{ github.event.inputs.build_type || 'release' }}"
          echo "Selected Build Type: $BUILD_CHOICE"

          mkdir -p app/build/outputs/apk/output

          # 1. Build Debug APK (instantly installable on all Android phones and tablets)
          if [ "$BUILD_CHOICE" = "debug" ] || [ "$BUILD_CHOICE" = "both" ]; then
            echo "--- Building Debug APK ---"
            ./gradlew assembleDebug --stacktrace --no-daemon
            mkdir -p app/build/outputs/apk/output
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/output/SonicAM-Debug.apk
          fi

          # 2. Build Release APK (standalone signed with keytool for direct installation on all devices)
          if [ "$BUILD_CHOICE" = "release" ] || [ "$BUILD_CHOICE" = "both" ]; then
            echo "--- Building Release APK ---"
            ./gradlew assembleRelease --stacktrace --no-daemon

            KEYSTORE="standalone-release.keystore"
            keytool -genkey -v -keystore "$KEYSTORE" -alias sonicam -keyalg RSA -keysize 2048 -validity 10000 -storepass sonicam123 -keypass sonicam123 -dname "CN=SonicAM, OU=Mobile, O=SonicAM, C=US"
            
            APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
            echo "Using apksigner: $APKSIGNER"

            RELEASE_DIR="app/build/outputs/apk/release"
            
            if [ -f "$RELEASE_DIR/app-release-unsigned.apk" ]; then
              $APKSIGNER sign --ks "$KEYSTORE" --ks-pass pass:sonicam123 --out app/build/outputs/apk/output/SonicAM-Release.apk "$RELEASE_DIR/app-release-unsigned.apk"
            elif [ -f "$RELEASE_DIR/app-release.apk" ]; then
              $APKSIGNER sign --ks "$KEYSTORE" --ks-pass pass:sonicam123 --out app/build/outputs/apk/output/SonicAM-Release.apk "$RELEASE_DIR/app-release.apk"
            fi
            
            # Create standard universal filenames for 1-click direct download
            cp app/build/outputs/apk/output/SonicAM-Release.apk app/build/outputs/apk/output/SonicAM.apk
            cp app/build/outputs/apk/output/SonicAM-Release.apk app/build/outputs/apk/output/SonicAM-Universal.apk
            echo "Universal APKs generated at output/SonicAM.apk & output/SonicAM-Universal.apk"
          fi

      - name: 📤 Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SonicAM-Android-Universal-APK
          path: mobile/android/app/build/outputs/apk/output/*.apk
          retention-days: 30

      - name: 🚀 Publish Universal APK to GitHub Releases (Direct Download)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.1.0
          name: "SonicAM Universal Android Release v1.1.0 (Phones & Tablets)"
          body: |
            ### ☕ SonicAM - Anything to Audio & Song Recognition Engine (Universal Android APK)
            
            **Direct Download Standalone APK** compiled for all Android devices.
            
            - **Compatibility**: Android 7.0 (Nougat) through Android 15+
            - **Form Factors**: Phones, Phablets, Foldables, and Tablets (7" to 12"+)
            - **Architecture**: Universal (ARM64-v8a, ARMv7a, x86, x86_64)
            - **Permissions**: Microphone (for ambient audio listening) and Internet
          files: |
            mobile/android/app/build/outputs/apk/output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

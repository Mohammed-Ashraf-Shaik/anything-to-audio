name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Choose APK Build Type (release, debug, or both)"
        required: true
        default: "both"
        type: choice
        options:
          - release
          - debug
          - both
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - "frontend/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build-apk:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🤖 Accept Android SDK Licenses
        run: |
          echo "Using pre-installed Android SDK at $ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 🟢 Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ⚡ Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/package.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 📦 Install Dependencies
        working-directory: ./mobile
        run: |
          npm install --legacy-peer-deps

      - name: 🏗️ Prebuild Native Android Project
        working-directory: ./mobile
        run: |
          python3 build_bundle.py || true
          npx expo prebuild --platform android --clean

          # Ensure cleartext HTTP is explicitly permitted
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /g' android/app/src/main/AndroidManifest.xml || true

          echo "=== Verifying gradle.properties ==="
          cat android/gradle.properties || true
          echo "=== Checking if bundle script exists ==="
          ls android/app/src/main/assets/ || echo "Assets dir empty (expected before build)"

      - name: 🔨 Build Standalone Universal Android APK (Phones & Tablets)
        working-directory: ./mobile/android
        env:
          NODE_PATH: "${{ github.workspace }}/mobile/node_modules"
        run: |
          chmod +x gradlew

          export PATH="${{ github.workspace }}/mobile/node_modules/.bin:$PATH"

          # Gradle props for CI stability
          echo "newArchEnabled=false" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> gradle.properties
          # hermesEnabled=true is critical for proper JS bundle embedding in Expo 52
          echo "hermesEnabled=true" >> gradle.properties

          BUILD_CHOICE="${{ github.event.inputs.build_type || 'both' }}"
          echo "Selected Build Type: $BUILD_CHOICE"

          mkdir -p app/build/outputs/apk/output

          # 1. Build Debug APK (instantly installable, zero Play Protect warnings)
          if [ "$BUILD_CHOICE" = "debug" ] || [ "$BUILD_CHOICE" = "both" ]; then
            echo "--- Building Debug APK ---"
            ./gradlew assembleDebug --stacktrace --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/output/SonicAM-Debug.apk
            # Verify bundle is inside debug APK
            unzip -l app/build/outputs/apk/output/SonicAM-Debug.apk | grep "index.android.bundle" || echo "WARN: bundle not found in debug APK"
            echo "Debug APK size: $(stat -c%s app/build/outputs/apk/output/SonicAM-Debug.apk) bytes"
          fi

          # 2. Build Release APK
          if [ "$BUILD_CHOICE" = "release" ] || [ "$BUILD_CHOICE" = "both" ]; then
            echo "--- Building Release APK ---"

            KEYSTORE="${{ github.workspace }}/mobile/sonicam-release.keystore"
            echo "Keystore path: $KEYSTORE"
            if [ ! -f "$KEYSTORE" ]; then
              echo "Keystore not found, generating ephemeral keystore..."
              keytool -genkey -v -keystore "$KEYSTORE" -alias sonicam -keyalg RSA -keysize 2048 \
                -validity 10000 -storepass sonicam123 -keypass sonicam123 \
                -dname "CN=SonicAM, OU=Mobile, O=SonicAM, C=US"
            else
              echo "Using existing persistent keystore"
              ls -la "$KEYSTORE"
            fi

            # Build release APK - Gradle's bundleReleaseJsAndAssets task handles JS bundling automatically
            ./gradlew assembleRelease --stacktrace --no-daemon

            RELEASE_DIR="app/build/outputs/apk/release"
            echo "=== Release APK directory contents ==="
            ls -lah "$RELEASE_DIR" || true

            ZIPALIGN=$(find $ANDROID_HOME/build-tools -name zipalign | sort -V | tail -n 1)
            APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
            echo "zipalign: $ZIPALIGN"
            echo "apksigner: $APKSIGNER"

            # Sign and zipalign
            if [ -f "$RELEASE_DIR/app-release-unsigned.apk" ]; then
              $ZIPALIGN -p -f 4 "$RELEASE_DIR/app-release-unsigned.apk" app/build/outputs/apk/output/aligned.apk
              $APKSIGNER sign --ks "$KEYSTORE" --ks-alias sonicam --ks-pass pass:sonicam123 \
                --out app/build/outputs/apk/output/SonicAM-Release.apk \
                app/build/outputs/apk/output/aligned.apk
            elif [ -f "$RELEASE_DIR/app-release.apk" ]; then
              $ZIPALIGN -p -f 4 "$RELEASE_DIR/app-release.apk" app/build/outputs/apk/output/aligned.apk
              $APKSIGNER sign --ks "$KEYSTORE" --ks-alias sonicam --ks-pass pass:sonicam123 \
                --out app/build/outputs/apk/output/SonicAM-Release.apk \
                app/build/outputs/apk/output/aligned.apk
            else
              echo "ERROR: No release APK found in $RELEASE_DIR"
              exit 1
            fi

            # Verify signature
            $APKSIGNER verify --verbose app/build/outputs/apk/output/SonicAM-Release.apk

            # CRITICAL: Verify JS bundle is inside the signed release APK
            echo "=== Verifying JS bundle is packaged correctly ==="
            unzip -l app/build/outputs/apk/output/SonicAM-Release.apk | grep "index.android.bundle" || {
              echo "FATAL: index.android.bundle NOT found in release APK!"
              exit 1
            }

            cp app/build/outputs/apk/output/SonicAM-Release.apk app/build/outputs/apk/output/SonicAM.apk
            cp app/build/outputs/apk/output/SonicAM-Release.apk app/build/outputs/apk/output/SonicAM-Universal.apk
            echo "=== All APKs ready ==="
            ls -lh app/build/outputs/apk/output/
          fi

      - name: 📤 Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SonicAM-Android-Universal-APK
          path: mobile/android/app/build/outputs/apk/output/*.apk
          retention-days: 30

      - name: 🚀 Publish Universal APK to GitHub Releases (Direct Download)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.2.5
          name: "SonicAM Universal Android Release v1.2.5 - Stable Build"
          make_latest: true
          body: |
            ### ☕ SonicAM - Anything to Audio & Song Recognition Engine (Universal Android APK)

            **v1.2.5 — Stable Build**: Fixed startup crash and JS bundle packaging.

            - **SonicAM-Debug.apk** ← **RECOMMENDED for direct install** (zero Play Protect warnings, opens immediately)
            - **SonicAM-Release.apk / SonicAM.apk**: Signed production build
            - **Compatibility**: Android 7.0 (Nougat) through Android 15+
            - **Architecture**: Universal (ARM64-v8a, ARMv7a, x86, x86_64)

            **Install instructions**: Uninstall old version first, then install from Files/Downloads app (not browser notification bar).
          files: |
            mobile/android/app/build/outputs/apk/output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

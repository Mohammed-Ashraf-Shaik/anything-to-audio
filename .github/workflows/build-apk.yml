name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Choose APK Build Type"
        required: true
        default: "both"
        type: choice
        options:
          - release
          - debug
          - both
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - "frontend/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build-apk:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🤖 Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 🟢 Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ⚡ Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/package.json') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: 📦 Install JS Dependencies
        working-directory: ./mobile
        run: npm install --legacy-peer-deps

      - name: 🏗️ Expo Prebuild (Generate Native Android Project)
        working-directory: ./mobile
        run: |
          # Regenerate the bundled WebView HTML asset
          python3 build_bundle.py || true

          # Generate the native Android project from the Expo config
          npx expo prebuild --platform android --clean

          # Allow cleartext HTTP so the WebView can reach the cloud backend
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /g' \
            android/app/src/main/AndroidManifest.xml || true

      - name: 🔧 Configure Gradle for Standalone (No Metro Required)
        working-directory: ./mobile/android
        run: |
          # BUNDLE_IN_DEBUG=true  → Gradle embeds the JS bundle into the DEBUG APK
          #                          so it runs without needing Metro dev server
          # BUNDLE_IN_RELEASE=true → same for RELEASE (this is the default, but explicit is safe)
          # newArchEnabled=false   → disable new arch to maximise device compatibility
          # hermesEnabled=true     → use Hermes JS engine (required for Expo SDK 52)
          cat >> gradle.properties << 'EOF'
          BUNDLE_IN_DEBUG=true
          BUNDLE_IN_RELEASE=true
          newArchEnabled=false
          hermesEnabled=true
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
          EOF

          echo "=== gradle.properties (last 10 lines) ==="
          tail -10 gradle.properties

      - name: 🔨 Build Debug APK (Standalone, No Play Protect Warnings)
        if: ${{ github.event.inputs.build_type != 'release' }}
        working-directory: ./mobile/android
        run: |
          export PATH="${{ github.workspace }}/mobile/node_modules/.bin:$PATH"
          export NODE_PATH="${{ github.workspace }}/mobile/node_modules"

          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

          mkdir -p app/build/outputs/apk/output
          cp app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/output/SonicAM-Debug.apk

          # VERIFY the JS bundle is physically inside the APK
          echo "=== Checking JS bundle is inside Debug APK ==="
          unzip -l app/build/outputs/apk/output/SonicAM-Debug.apk | grep "index.android.bundle" \
            || { echo "FATAL: JS bundle missing from Debug APK!"; exit 1; }

          echo "✅ Debug APK OK: $(stat -c%s app/build/outputs/apk/output/SonicAM-Debug.apk) bytes"

      - name: 🔨 Build Release APK (Signed Standalone)
        if: ${{ github.event.inputs.build_type != 'debug' }}
        working-directory: ./mobile/android
        run: |
          export PATH="${{ github.workspace }}/mobile/node_modules/.bin:$PATH"
          export NODE_PATH="${{ github.workspace }}/mobile/node_modules"

          chmod +x gradlew

          # Keystore for signing
          KEYSTORE="${{ github.workspace }}/mobile/sonicam-release.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            echo "Generating keystore..."
            keytool -genkey -v \
              -keystore "$KEYSTORE" -alias sonicam \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass sonicam123 -keypass sonicam123 \
              -dname "CN=SonicAM,OU=Mobile,O=SonicAM,C=US"
          fi

          ./gradlew assembleRelease --stacktrace --no-daemon

          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name zipalign | sort -V | tail -n1)
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n1)
          RELEASE_DIR="app/build/outputs/apk/release"
          mkdir -p app/build/outputs/apk/output

          echo "=== Release dir contents ==="
          ls -lah "$RELEASE_DIR"

          # Pick the unsigned or already-signed APK
          if [ -f "$RELEASE_DIR/app-release-unsigned.apk" ]; then
            SRC="$RELEASE_DIR/app-release-unsigned.apk"
          elif [ -f "$RELEASE_DIR/app-release.apk" ]; then
            SRC="$RELEASE_DIR/app-release.apk"
          else
            echo "FATAL: No release APK found!"; exit 1
          fi

          $ZIPALIGN -p -f 4 "$SRC" app/build/outputs/apk/output/aligned.apk
          $APKSIGNER sign \
            --ks "$KEYSTORE" --ks-alias sonicam --ks-pass pass:sonicam123 \
            --out app/build/outputs/apk/output/SonicAM-Release.apk \
            app/build/outputs/apk/output/aligned.apk

          cp app/build/outputs/apk/output/SonicAM-Release.apk \
             app/build/outputs/apk/output/SonicAM.apk

          # VERIFY the JS bundle is physically inside the signed APK
          echo "=== Checking JS bundle is inside Release APK ==="
          unzip -l app/build/outputs/apk/output/SonicAM-Release.apk | grep "index.android.bundle" \
            || { echo "FATAL: JS bundle missing from Release APK!"; exit 1; }

          $APKSIGNER verify --verbose app/build/outputs/apk/output/SonicAM-Release.apk
          echo "✅ Release APK OK: $(stat -c%s app/build/outputs/apk/output/SonicAM-Release.apk) bytes"

      - name: 📋 List All Built APKs
        working-directory: ./mobile/android
        run: ls -lh app/build/outputs/apk/output/ || true

      - name: 📤 Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SonicAM-Android-APK-v1.2.5
          path: mobile/android/app/build/outputs/apk/output/*.apk
          retention-days: 30

      - name: 🚀 Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.2.5
          name: "SonicAM v1.2.5 — Standalone Android APK (Works Without Dev Server)"
          make_latest: true
          body: |
            ## ☕ SonicAM v1.2.5 — Universal Android APK

            **✅ Fully standalone** — opens directly, no "Could not connect to development server" error.

            | File | Description |
            |---|---|
            | **[SonicAM-Debug.apk](https://github.com/Mohammed-Ashraf-Shaik/anything-to-audio/releases/latest/download/SonicAM-Debug.apk)** | ⬅️ **Best for direct install** — zero Play Protect warnings |
            | **[SonicAM-Release.apk](https://github.com/Mohammed-Ashraf-Shaik/anything-to-audio/releases/latest/download/SonicAM-Release.apk)** | Signed production build |

            **Compatibility**: Android 7.0+ · ARM64 · ARMv7 · x86_64

            > Uninstall old version first → tap downloaded APK from Files app → Install → Open ✅
          files: mobile/android/app/build/outputs/apk/output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
